name: ipproxypool-gw-r1

services:
  redis:
    image: redis:7-alpine
    container_name: ipproxy-redis
    # OPT-R4 C1：宿主/daemon 重启后自愈。C6：只绑回环（杀局域网直达）＋密码
    # （杀未授权写池/遥测；密码经 .env，见 .env.example；默认值为开发缺省）。
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-123456}"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-123456}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:24-alpine
    container_name: ipproxy-clickhouse
    restart: unless-stopped
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9010:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./deploy/clickhouse:/docker-entrypoint-initdb.d:ro
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-proxy}
      CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD:-123456}"
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-proxy}
    healthcheck:
      # OPT-R7 C1：探针从 `wget --spider` 改为 `clickhouse-client --query "SELECT 1"`。
      #
      # 根因（此前是 P1 阻断项）：项目文档自承该 wget 探针不可靠
      # （见 docs/USER_MANUAL.md「CH 容器 unhealthy？」条、docs/HANDS-ON.md），
      # 而本机 `docker ps` 长期显示 `ipproxy-clickhouse (unhealthy)`。
      # 由于 gateway 服务 `depends_on: clickhouse: condition: service_healthy`，
      # 该探针失败 ⇒ **`docker compose --profile gateway up` 下网关永不启动**。
      #
      # `clickhouse-client` 在本镜像内已随服务端安装，用它做真实 SQL 往返探针，
      # 顺带验证账号密码（比 wget 只探端口更严）。凭据取环境变量，不硬编码。
      test:
        - CMD-SHELL
        - clickhouse-client --user "$${CLICKHOUSE_USER:-proxy}" --password "$${CLICKHOUSE_PASSWORD:-123456}" --query "SELECT 1" || exit 1
      interval: 5s
      timeout: 5s
      retries: 20
      # OPT-R7 C1：CH 冷启动需 10~20s，建表/加载元数据更久；start_period 内
      # 探针失败不计入 retries，避免启动期被误判 unhealthy。
      start_period: 20s

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: ipproxy-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # C3 告警规则（rules 原生能力，无需额外 feature flag）。
      - ./deploy/prometheus/rules.yml:/etc/prometheus/rules.yml:ro
      # OPT-R7 C2：补 TSDB 持久化卷。此前 prometheus 只挂了两个只读配置文件，
      # 数据全在容器可写层 ⇒ **`docker compose up -d` 的任何一次 recreate/down-up
      # 都会清空全部历史指标**。直方图（gateway_processing_duration_ms_bucket、
      # free_pool_fwd_latency_ms_bucket）恰恰需要跨重启累计才能算 P99/均值——
      # 这是一个「以为有 observability，实际每次重启归零」的静默失效。
      - prometheus-data:/prometheus
      # OPT-R4 C9：Alertmanager 接线**已在 prometheus.yml 内完成**
      # （`alerting.alertmanagers.targets: ["alertmanager:9093"]`，
      #  见 deploy/prometheus/prometheus.yml）。
      #
      # OPT-R17 更正两处失实（此前会让人以为"接线还没做"）：
      #  ① 本条**曾**注释着「取消注释＋重启 prom 即投递」并挂着
      #     `- ./deploy/alertmanager.yml:/etc/prometheus/alertmanager.yml:ro`。
      #     那是**多余且无效**的：Alertmanager 的收件人配置由 **alertmanager
      #     容器自己**读 `/etc/alertmanager/alertmanager.yml`（见下方
      #     alertmanager 服务的 volumes），Prometheus 侧根本不需要这个文件，
      #     挂进去也不会被读取。真正需要改的是 `deploy/alertmanager.yml` 的
      #     `route.receiver`，改完重启 **alertmanager** 容器（不是 prom）。
      #  ② 故把这条误导性挂载删除，避免"照着注释操作却毫无效果"。
      #
      # 投递链路现状（OPT-R17 实测取证）：链路已通到 Alertmanager，
      # 但 `route.receiver: "empty"` 是**刻意**的空接收器（开发环境避免误报
      # 到真实渠道）⇒ **告警不会外发给人**。要真正收到通知，必须按
      # deploy/alertmanager.yml 头部说明启用 webhook 或 email 并填入
      # 真实凭据（凭据不入仓）。详见 docs/OPERATION.md §告警投递。

      # 改 alertmanager.yml 后需 restart（Prometheus 默认禁用 /-/reload，
      # 但本次改的是 alertmanager 侧配置，prom 侧**无需**重启）。

  grafana:
    image: grafana/grafana:11.1.0
    container_name: ipproxy-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-change-me-in-prod}
    volumes:
      - grafana-data:/var/lib/grafana
      # Grafana provisioning-as-code: datasource + dashboard auto-load on boot
      # (named volume keeps runtime edits; fresh volume gets full observability).
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana:/etc/grafana/dashboards:ro

  # C6 容器化网关（profile-gated opt-in：默认 `compose up` 行为不变，
  # 仍是宿主二进制直跑＋prom 抓宿主 :9091；冒烟见下，生产切换（prom 改抓
  # gateway:9091）是后续独立事项，本计划内不做）。
  # 冒烟：docker compose --profile gateway up -d --build gateway
  #      → curl :8916（宿主 mock 不可达时 503 空池，属预期）＋ :9091/metrics 200
  #      → docker compose --profile gateway stop gateway（宿主网关不受影响）。
  gateway:
    build: ./gateway
    profiles: ["gateway"]
    container_name: ipproxy-gateway
    # OPT-R5 O5：网关端口收回环（D3 回环缺省；局域网需敞口时用显式覆写，
    # 如 compose.override.yml 打开 0.0.0.0:8916:8916）。
    ports:
      - "127.0.0.1:8916:8916"
      - "127.0.0.1:9091:9091"
    environment:
      # D3：与宿主缺省一致，门默认开启（本地开发带 default_key 头）。
      REQUIRE_API_KEY: "1"
      REDIS_URL: "redis://:${REDIS_PASSWORD:-123456}@redis:6379/"
      CLICKHOUSE_URL: "http://clickhouse:8123"
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-proxy}
      CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD:-123456}"
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-proxy}
      # 容器内必须绑 0.0.0.0（D3 起宿主缺省已收 127.0.0.1，此处两者均显式覆写）。
      GATEWAY_ADDR: "0.0.0.0:8916"
      METRICS_ADDR: "0.0.0.0:9091"
    depends_on:
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy

  # OPT-2 环境门示例（D3 起默认开启，无头 403；`REQUIRE_API_KEY=0` 显式关闭，容器/宿主通用）：
  # R2-8 配置 env 化示例（缺省沿用 main.rs code 常量，只覆盖需改项）：
  #     REQUIRE_API_KEY: "1"
  #     REDIS_URL: "redis://redis:6379/"
  #     CLICKHOUSE_URL: "http://clickhouse:8123"
  #     CLICKHOUSE_USER: "proxy"
  #     CLICKHOUSE_PASSWORD: "123456"
  #     CLICKHOUSE_DB: "proxy"
  #     GATEWAY_ADDR: "0.0.0.0:8916"
  #     METRICS_ADDR: "127.0.0.1:9091"
  #     PROBE_INTERVAL_SECS: "60"
  #     SWEEP_INTERVAL_SECS: "60"
  #     ARBITRAGE_INTERVAL_SECS: "60"
  #     PREWARM_INTERVAL_SECS: "30"
  #     # FreePool 第二供应线（默认关闭；FREE_ENABLED=1 开；全量 env 见计划 §2）。
  #     FREE_ENABLED: "1"
  #     FREE_API_URLS: "https://proxylist.geonode.com/api/proxy-list?limit=100&page=1&sort_by=lastChecked&sort_type=desc"
  #     FREE_HTML_URLS: "https://free-proxy-list.net/"
  #     FREE_GITHUB_URLS: "https://raw.githubusercontent.com/clarketm/proxy-list/master/proxy-list-raw.txt"
  #     FREE_FETCH_INTERVAL_SECS: "600"
  #     FREE_TTL_SECS: "1800"
  #     FREE_VERIFY_TIMEOUT_SECS: "3"
  #     FREE_MAX_LATENCY_MS: "3000"
  #     FREE_MAX_CONCURRENT: "50"
  #     FREE_FULL_CONCURRENT: "20"
  #     FREE_MAX_NODES: "2000"
  #     FREE_FULL_CHECK_URL: "https://httpbin.org"
  #     FREE_REQUIRE_ELITE: "0"
  #     FREE_SOURCE_MAX_ZERO_CYCLES: "3"
  #     FREE_SUSPEND_RETRY_EVERY: "3"
  #     # P2 SOCKS 翻译桥（显式 X-Proxy-Proto: socks5/socks4 请求出站执行器）。
  #     SOCKS_BRIDGE_TIMEOUT_SECS: "20"
  #     SOCKS_MAX_BODY_BYTES: "10485760"
  #     # P3 GeoIP 画像（GeoLite2-City.mmdb 路径；不配即 Disabled 降级，只观察不执法）。
  #     GEOIP_MMDB_PATH: "/data/GeoLite2-City.mmdb"
  #     # P4 mismatch 执法（默认 0 只观察；库 Live＋观察无误报后再开 1）。
  #     GEOIP_ENFORCE_MISMATCH: "0"
  #     # P4 库更新产物挂载（deploy/geoip_update.py --out-dir ./data 写入宿主 ./data，网关只读挂载）：
  #     # volumes:
  #     #   - ./data:/data:ro

  # OPT-R4 C11：redis_exporter（profile-gated opt-in；镜像需联网拉取，
  # 本机 Hub 不通故默认不带；跑起后 prom 自动有 redis_stream_length 序列，
  # TelemetryStreamLagGrowing 规则自动生效）。
  # 用法：docker compose --profile observability up -d redis-exporter
  redis-exporter:
    image: oliver006/redis_exporter:v1.66.0
    profiles: ["observability"]
    container_name: ipproxy-redis-exporter
    ports:
      - "127.0.0.1:9121:9121"
    environment:
      REDIS_ADDR: "redis://redis:6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-123456}"
      CHECK_SINGLE_KEYS: "stream:proxy:telemetry"
    depends_on:
      redis:
        condition: service_healthy

  # OPT-R5 O9：alertmanager。
  #
  # OPT-R17：去掉 `profiles: ["observability"]` —— 此前 profile-gated 意味着
  # `docker compose up -d` **不起**它，而 prometheus.yml 的 `alerting:` 块
  # 无条件指向 `alertmanager:9093`。结果是：默认部署下 Prometheus 持续重试
  # 一个不存在的 target，告警既不外发、也不出现在 Alertmanager 侧
  # （Prometheus 只在自己 UI 显示 firing）。这是"以为接了告警、实际没接"。
  #
  # 保持默认起、但 receiver 仍是 `empty`（不误报到真实渠道）——即
  # **链路默认可达、投递默认关闭**：运维能在 Alertmanager UI 看到告警分组、
  # 做 silence（静默）与 ack（确认），把 `empty` 从"丢弃黑洞"升格为
  # "可操作的观察窗"。
  #
  # 用法：docker compose up -d alertmanager（现已属默认服务，无需 --profile）
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: ipproxy-alertmanager
    restart: unless-stopped
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      # 收件人配置由 **alertmanager 自己**读这个路径（Prometheus 不读它）。
      - ./deploy/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"

volumes:
  redis-data:
  clickhouse-data:
  grafana-data:
  alertmanager-data:
  # OPT-R7 C2：Prometheus TSDB 持久化（此前缺失 ⇒ 每次 recreate 指标归零）。
  prometheus-data:
