[package]
name = "pingora-proxy-gateway"
version = "0.2.0"
edition = "2021"
description = "Enterprise high-availability smart IP proxy pool gateway (GW-R1)"
license = "MIT"

[[bin]]
name = "pingora-proxy-gateway"
path = "src/main.rs"

[dependencies]
# Cloudflare Pingora core suite (GW-1 gateway)
# NOTE: manual says 0.4 but 0.4 breaks on rustc 1.93 (sfv 0.15 / tokio-rustls id mismatch).
# 0.6 -> 0.9 (2026-10)：0.6 命中多条 RustSec 公告（RUSTSEC-2026-0033/0034/0035 HTTP 走私与缓存投毒、
# 经由 prometheus 0.13 -> protobuf 2.28 的 RUSTSEC-2024-0437）；0.9 起 pingora-core 移除
# prometheus/protobuf、daemonize 换 daemonix，并加入 HTTP 解析加固。本仓只用 ProxyHttp/Session/
# Server 标准面，实测 API 兼容（详见 Cargo.lock 同步升级记录）。
pingora = { version = "0.9", features = ["proxy", "lb", "rustls"] }
pingora-core = "0.9"
pingora-proxy = "0.9"
pingora-load-balancing = "0.9"

# Async runtime & utils
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# Lock-free structures
arc-swap = "1.7"
dashmap = "6.0"
parking_lot = "0.12"

# Serialization & web
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bytes = "1.6"
http = "1.1"
log = "0.4"
env_logger = "0.11"
rand = "0.8"
base64 = "0.22"
# Pin process-default rustls provider (both ring+aws-lc-rs are compiled in via
# pingora/reqwest features, so rustls can't auto-pick; install ring explicitly).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

# GW-2 telemetry / probing
redis = { version = "0.26", features = ["tokio-comp", "connection-manager", "streams", "aio"] }
crossbeam-channel = "0.5"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "socks", "stream"] }

# GW-3 bandit / fingerprint
nalgebra = { version = "0.33", default-features = false, features = ["std"] }
atomic_float = "1.1"
sha2 = "0.10"

# GW-4 analytics / tenant
# lz4 is a default feature of clickhouse 0.13 (verified in registry source);
# `chrono` is opt-in and required for DateTime64(3) <-> DateTime<Utc>.
clickhouse = { version = "0.13", features = ["chrono"] }
chrono = "0.4"
governor = "0.6"
nonzero_ext = "0.3"

# GW-5 Admin REST API (Phase 1): axum HTTP 框架 + utoipa OpenAPI 自动生成。
# 与数据面 Pingora 完全隔离，独立端口 (:9092)，独立认证 (ADMIN_API_KEY)。
#
# OPT-R17：`tower-http` 的 feature 清单此前与真实代码**不一致**——
# 声明了 cors/trace/timeout 三个 feature，而 src/ 零引用（admin.rs 注释还
# 声称"含 CORS + 超时"，两处都不实）。逐项处置：
#   - timeout：**保留并真正启用**（admin.rs 的 TimeoutLayer，Admin 端点全为
#     内存操作，30s 兜底防慢请求占满连接）。
#   - trace：**移除**。TraceLayer 发的是 `tracing` 事件，本项目装的是
#     env_logger（log facade），无 tracing subscriber ⇒ 会得到"加了审计却一条
#     不打印"的静默失效。审计改由 admin.rs 的 `audit_logging` 用 `log` 手写。
#   - cors：**移除**。Admin API 走 X-Admin-Key 头认证，开 permissive CORS
#     会让任意站点的 JS 都能发起带凭据的跨域请求，把攻击面从本机回环扩大到
#     任何能访问 :9092 的站点；Admin UI 的实际部署（同域反代 / Vite proxy）
#     不需要 CORS。详见 admin.rs::router 的说明。
axum = "0.7"
utoipa = "5.0"
tower-http = { version = "0.5", features = ["timeout"] }
tower = "0.5"

# P3 exit-IP 画像：MaxMind DB 读取（DB 文件运营方配给，见 GEOIP_MMDB_PATH；
# 沙箱无库时走 Disabled 降级，见 geo.rs 与计划 F0）。
maxminddb = "0.32"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# 复审结论：unwind（默认）而非 abort——supervise() 靠 JoinHandle 捕获 panic 重启后台任务，
# abort 下任一 panic 直接带走整个进程，supervisor 形同虚设。strip 保留（体积）。
panic = "unwind"
strip = true
