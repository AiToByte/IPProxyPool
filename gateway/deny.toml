# cargo-deny 配置（OPT-R16 C：供应链治理）
#
# 用途：漏洞（RustSec）+ 重复版本/通配符（bans）+ 许可证（licenses）+
#       依赖来源（sources）四类门禁，一次 `cargo deny check` 全跑。
#
# 本地用法：
#   cargo install --locked cargo-deny cargo-audit   # 一次性安装
#   cargo deny check                                  # 全量检查
#   cargo deny check advisories                       # 只查漏洞
# CI 用法：见 tools/check_supply_chain.py（仓库门禁统一走 Python 脚本）。
#
# 版本注意（cargo-deny 0.20.2；2026-10 对照官方文档
#   embarkstudios.github.io/cargo-deny → checks/advisories 核实，修正旧注记）：
#   - [advisories] 移除的键是 vulnerability / unsound / notice /
#     severity-threshold（写了就报错，漏洞类无条件 error——这部分与旧注记一致）。
#   - 但 yanked 与 unmaintained 并未移除，只是取值变了：
#     yanked = deny | warn（默认） | allow；
#     unmaintained = all（默认：任何 crate 命中即失败） | workspace（仅直依失败，
#     传递仅 warn） | transitive（仅传递失败） | none（完全不查）。
#   - [licenses] 也没有 unlicensed/deny/copyleft 键，纯 allowlist 模型：
#     不在 `allow` 里的许可证即失败。copyleft 系天然不在 allow 里，
#     无需单独列 deny。
#   - 配错不会静默：cargo-deny 会直接拒绝运行并指出行号（本轮已踩两次，
#     见下文记录）。这比"配错但绿"要好得多。
#
# 策略说明（每个选项都有理由，不接受"默认即可"）：
#   - bans.multiple-versions = warn：当前 lock 有 17 个包存在多版本
#     （pingora 0.9 升级后实测，syn/hashbrown 等均为传递依赖 pin 住不同 major）。
#     一步收紧到 deny 需要大面积 skip 清单或升级依赖，风险收益比不划算；
#     先 warn 可见，收敛到可处理时再收紧。warn 不阻断 CI，但会在日志留痕。
#   - licenses.allow：2026-10 实测 373 个 package 全为宽松许可证
#     （MIT/Apache/BSD/ISC/Zlib/Unlicense 等），无 GPL 系。
#     allowlist 保证"新增未知许可证即红"，而不是"只拦已知坏的"。
#   - sources：只允许 crates.io。当前 lock 全部来自单一源，无 git/path 依赖。

[graph]
# 默认包含 dev 依赖。本仓 dev 依赖只有 tokio（已是主依赖），无额外攻击面，
# 故不需 exclude-dev。

[advisories]
db-path = "~/.cargo/advisory-dbs"
db-urls = ["https://github.com/RustSec/advisory-db"]
# unmaintained = workspace（0.20 取值为域，见上方版本注记）：
#   直依 unmaintained 一律 error——绝不降级；传递依赖上的 unmaintained 记 warn 可见
#   但不阻断。理由：当前 4 个传入 unmaintained 全为传递依赖（2026-10 triage，路径与
#   处置见 docs/SUPPLY_CHAIN.md §4）：
#     derivative  ← pingora-core 0.9（上游仍在用，无替代版本）
#     paste       ← simba ← nalgebra 0.33（本仓直依 nalgebra 的宏链）
#     rustls-pemfile ← pingora-rustls（证书加载，上游未迁移 pki-types）
#     unsafe-libyaml ← serde_yaml 0.9 ← pingora-core（server conf YAML 解析）
#   四者均 "No safe upgrade is available"，本仓 Cargo.toml 无升级路径；pingora 升级
#   已清掉 atty/daemonize/proc-macro-error/yaml-rust 等 6 个，剩余属上游债。
unmaintained = "workspace"
# NOTE: ignore 只能加"已确认不可达/已确认不可修"的 advisory，每条必须写理由。
# 每条 ignore 都是一次显式风险接受，review 时重点看这里。
#
# ============================================================================
# 2026-11-01：zstd 生态 4 条公告（OPT-R18 供应链处置）
# ============================================================================
# 共同背景（**"不可修"**）：zstd 的两个版本都在树里，且都由 pingora 0.9.0 拉入——
#   zstd 0.13.3 ← pingora-header-serde 0.9.0（要求 `zstd ^0.13.1` + `zstd-safe ^7.1.0`）
#   zstd 0.14.0 ← pingora-core 0.9.0
# 而两条线**都没有补丁版本**：公告的 patched 只有 `zstd >= 0.14.3`、
# `zstd-safe >= 8.2.0`、`zstd-sys >= 2.1.2`，0.13.x / 7.x 线上不存在修复。
# `cargo search pingora` 实测：`pingora` 最新就是 **0.9.0**（即当前版本），
# 故本仓**无升级路径**——这不是"懒得升"，是上游还没有含修复的版本。
#
# 逐条**可达性**（源码级调用图，2026-11-01 实测；`grep` 于
# `~/.cargo/registry/src/*/pingora-*/src/` 全树，命中数均为 0）：
#   * 0391 受影响符号 = `zstd::stream::raw::{Encoder,Decoder}::with_context`
#     ⇒ pingora 全树**无 `with_context` 调用**；pingora-header-serde 只用
#        `zstd::dict` + `zstd_safe::{CCtx,DCtx}::create` + `decompress_to_buffer`。
#   * 0398 受影响符号 = `zstd_safe::Seekable::decompress`
#     ⇒ pingora 全树**无 `Seekable`**（zstd 0.13.3 源码里也没有该 API）。
#   * 0403 受影响符号 = `zstd_safe::DCtx::decompress_stream`
#     ⇒ pingora 全树**无 `decompress_stream`**（走的是 `decompress_to_buffer`，
#        公告原文明确 `read::Decoder`/`decode_all`/bulk API 不受影响）。
#   * 0410 仅 wasm32（zstd-sys 给 C 库的 malloc/free shim）⇒ 本仓只构建
#     x86_64-windows / x86_64-linux，**平台不可达**。
# 本仓自身代码对 zstd **零引用**（`grep -rn zstd src/` 无命中），不存在第二条路径。
#
# ⚠️ 一处**失败的方法论记录**：本想把"符号不在二进制里"作为硬证据，用
# `llvm-nm` 查 PE 符号 → 全为 0，但**对照组（确定被调用的 `decompress_to_buffer`）
# 也是 0**，说明该方法对 PE 无效；改用 PDB 字符串搜索后，对照组成立（8），
# 但 `with_context`(8)/`Seekable`(1) 的命中来自**通用名污染**——`with_context`
# 实际来自 anyhow（完全无关的 crate）。故最终证据是**源码级调用图**，
# 不是符号级；只有 `decompress_stream` 的符号级读数（0）是干净的、与源码结论一致。
#
# 退出条件：`unused-ignored-advisory = "deny"` 会在 pingora 升级到含修复的版本
# （届时这些 advisory 不再命中）时**自动报错**，强制我们删掉这几条 ignore。
# 故这批豁免不会变成僵尸。
ignore = [
    { id = "RUSTSEC-2026-0391", reason = "zstd with_context 数据跨流泄漏：pingora 全树无 with_context 调用；zstd 0.13.3/0.14.0 均无补丁版本，pingora 最新 0.9.0 即当前版本，无升级路径" },
    { id = "RUSTSEC-2026-0398", reason = "zstd_safe Seekable::decompress 越界设 Vec 长度：pingora 全树无 Seekable 调用；补丁仅 >=8.2.0，当前 7.x/0.13 线无修复" },
    { id = "RUSTSEC-2026-0403", reason = "DCtx::decompress_stream 未初始化内存：pingora 全树无 decompress_stream 调用（走 decompress_to_buffer，公告明示不受影响）；补丁仅 >=8.2.0" },
    { id = "RUSTSEC-2026-0410", reason = "zstd-sys wasm32 分配器 shim：本仓只构建 x86_64-windows/x86_64-linux，平台不可达" },
]
# 门禁健忘防护：ignore 一旦失效（上游修复/依赖消失）立即报错，防止默默积累僵尸豁免。
unused-ignored-advisory = "deny"

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
# workspace-dependencies 不用：本仓是单包 crate，无 workspace 继承。
allow = []
deny = []
skip = []
skip-tree = []
# NOTE: skip/skip-tree 只能加"传递依赖 pin 住不同 major 且无法升级"的包，
# 每条必须写理由。当前 17 个多版本包（pingora 0.9 后实测）全部走 warn，不设 skip。

[licenses]
# allowlist（2026-10 实测生成，覆盖 lock 中全部 crate）：
# 全部为 OSI/FSF 认可的宽松许可证。新增任何不在此列的许可证即红，
# 倒逼每次引入新许可证时做一次显式评审。
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "ISC",
    "Zlib",
    "Unlicense",
    "CC0-1.0",
    "MIT-0",
    "BSL-1.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CDLA-Permissive-2.0",
]
# 置信度阈值 0.8：license 文件文本匹配低于此值会告警，
# 避免"声明是 MIT 实则是改写版"的文本漂移。
confidence-threshold = 0.8
# workspace 自身（MIT）不参与检查，避免自检噪声。
private = { ignore = true }
exceptions = []
# NOTE: exceptions 只能加"主许可证合规但有个别文件例外"的包，每条写理由。

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
