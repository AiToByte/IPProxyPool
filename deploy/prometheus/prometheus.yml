global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules.yml

# OPT-R5 O9：Alertmanager 接线（compose alertmanager 服务 profile-gated；
# `docker compose --profile observability up -d alertmanager` 后重载 prom 即投递；receiver 仍 empty）。
# 注记：顶层键必须是 alerting: 包 alertmanagers:（裸 alertmanagers: 会整库起不来，冒烟实锤已修正）。
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: "pingora-gateway"
    static_configs:
      # OPT-R4 C2：host.docker.internal 仅 Docker Desktop 有效；Linux 生产
      # 把下行改 gateway:9091（容器网关 profile）或宿主 IP:9091（宿主二进制）。
      - targets: ["host.docker.internal:9091"]
    metrics_path: /metrics

  # OPT-R4 C11：redis-exporter（compose profile observability；未跑时
  # target 为 down（无配套告警，只看 /targets），跑起即有序列）。
  - job_name: "redis-exporter"
    static_configs:
      - targets: ["ipproxy-redis-exporter:9121"]
