global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules.yml

# OPT-R5 O9：Alertmanager 接线。**此块早已生效**（此前 docker-compose.yml 里
# 却注释着"取消注释即接线"，属失实注释，OPT-R17 已更正）。
#
# 链路现状（OPT-R17 取证）：
#   Prometheus ──alerting──▶ Alertmanager ──▶ receiver
#                              (默认起)        ("empty" ⇒ 不外发)
#
# 即：**告警已能到达 Alertmanager**（可在其 UI 分组/silence/ack），
# 但**不会外发给人**，因为 deploy/alertmanager.yml 的 receiver 是刻意留空的
# "empty"（避免开发环境误报真实渠道）。要真正收到通知，改那个文件的
# route.receiver 并重启 alertmanager 容器即可，本文件无需改动。
# 详见 docs/OPERATION.md §告警投递。
#
# 注记：顶层键必须是 alerting: 包 alertmanagers:（裸 alertmanagers: 会整库起不来，冒烟实锤已修正）。
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: "pingora-gateway"
    static_configs:
      # OPT-R4 C2：host.docker.internal 仅 Docker Desktop 有效；Linux 生产
      # 把下行改 gateway:9091（容器网关 profile）或宿主 IP:9091（宿主二进制）。
      - targets: ["host.docker.internal:9091"]
    metrics_path: /metrics

  # OPT-R4 C11：redis-exporter（compose profile observability；未跑时
  # target 为 down（无配套告警，只看 /targets），跑起即有序列）。
  - job_name: "redis-exporter"
    static_configs:
      - targets: ["ipproxy-redis-exporter:9121"]
