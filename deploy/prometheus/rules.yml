# IPProxyPool Prometheus alert rules (Phase C3, OPT-R4 C9/C11 tuned).
# All LHS series are rendered by the gateway itself (gateway/src/metrics.rs),
# except redis_stream_length (needs redis_exporter, compose profile
# `observability`; rule stays inactive until the series exists).
# `up` is the built-in scrape-health series.
groups:
  - name: ipp-gateway
    interval: 30s
    rules:
      # 数据面成功率：2xx / 全部分类。分母含 4xx 拦截（坏 Key/无头属预期行为，
      # 压测坏 Key 会拉低成功率，见 annotation）。
      - alert: GatewaySuccessRateLow
        expr: |
          sum(rate(proxy_requests_total{status="2xx"}[5m]))
          /
          sum(rate(proxy_requests_total[5m]))
          < 0.99
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "网关 5 分钟成功率 < 99%"
          describe: "2xx 占比 {{ $value | humanizePercentage }}；分母含 4xx 拦截，坏 Key 压测属预期拉低。"

      # 免费池水位：30 分钟窗口最大值仍为 0 即干旱。severity 仅 warning——
      # 免费源本就轮转低谷常态 pool=0（见 FREE_BASELINE），此规则抓超长干旱。
      - alert: FreePoolDry30m
        expr: max_over_time(free_pool_nodes_total[30m]) == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "免费池连续 30 分钟水位 0"
          describe: "免费源轮转低谷属正常；超 30 分钟请查源站存活与熔断 free_pool_source_suspended。"

      # 后台 worker 重启（supervisor 捕获 panic/意外返回后自愈）。
      # Windows 本机调试偶发 tokio 退出抖动（见 EXEC），单次重启是自愈证据；
      # OPT-R4 C9：阈值收紧为 15 分钟窗内 >3 次（抖动不再噪，连续崩才报）。
      - alert: SupervisorRestarted
        expr: increase(supervisor_restarts_total[15m]) > 3
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "后台 worker 频繁重启 ({{ $labels.worker }})"
          describe: "15 分钟窗内重启 {{ $value }} 次（>3）；先看对应 worker 日志，网关进程若连带退出查看护日志。"

      # 网关抓取失联（内置 up 序列，无需额外指标）。
      - alert: GatewayDown
        expr: up{job="pingora-gateway"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "网关 /metrics 抓取失联超 2 分钟"
          describe: "先看网关进程与看护日志 log/ipp-watchdog.out，再查 :9091 本机直访。"

      # ---- OPT-R4 C11：已接线（redis_exporter profile-gated，见 compose）。
      # key 名以网关 telemetry stream 为准（`stream:proxy:telemetry`，见 telemetry.rs）。
      # exporter 未跑时序列缺失，规则静默（inactive），跑起即自动生效。
      - alert: TelemetryStreamLagGrowing
        expr: increase(redis_stream_length{key="stream:proxy:telemetry"}[10m]) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "遥测 Stream 积压持续增长"
