# GW-R1 Linux egress sysctl hardening (BBRv3 + TFO + keepalive)
# Apply on production POPs: `sysctl -p deploy/sysctl.conf`
# Windows dev boxes ignore this file (documented for the Linux perf node).

# --- Congestion control: BBRv3 where available, cubic fallback ---
net.ipv4.tcp_congestion_control = bbr
net.core.default_qdisc = fq

# --- TCP Fast Open (matches gateway tcp_fast_open=true) ---
# bit0 client + bit1 server
net.ipv4.tcp_fastopen = 3

# --- Keepalive (matches gateway 60s/10s/3 profile) ---
net.ipv4.tcp_keepalive_time = 60
net.ipv4.tcp_keepalive_intvl = 10
net.ipv4.tcp_keepalive_probes = 3

# --- Socket buffers: 64KB aligned with gateway tcp_recv_buf ---
net.core.rmem_max = 134217728
net.core.wmem_max = 134217728
net.ipv4.tcp_rmem = 4096 65536 134217728
net.ipv4.tcp_wmem = 4096 65536 134217728

# --- Connection scale (50k+ concurrency target) ---
net.core.somaxconn = 65535
net.ipv4.tcp_max_syn_backlog = 65535
net.ipv4.ip_local_port_range = 1024 65535
net.netfilter.nf_conntrack_max = 1000000
net.ipv4.tcp_tw_reuse = 1
net.ipv4.tcp_fin_timeout = 15

# --- File descriptors (raise ulimit -n to match) ---
fs.file-max = 2000000
