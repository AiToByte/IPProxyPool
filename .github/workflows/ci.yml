# IPProxyPool CI (Phase C5): mirrors the local four-gate exactly.
# Local: cargo fmt --check / cargo clippy --workspace --all-targets -- -D warnings
#        / cargo test --workspace / cargo bench --workspace --no-run
#        (+ cargo test --release bandit for the <200ns select path).
# Live `-- --ignored` tests need Redis + ClickHouse, so they live in
# live.yml (manual dispatch only), never in this auto gate.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: fmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: unit tests
        run: cargo test --workspace
      - name: release bandit (<200ns select path)
        run: cargo test --release bandit
      - name: bench compile
        run: cargo bench --workspace --no-run

  # OPT-R4 C8：脚本/配置漂移门（端口/头名/规则在合入前拦截；cargo 门在上）。
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PowerShell scripts (PSScriptAnalyzer, errors only)
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          Invoke-ScriptAnalyzer -Path tools -Recurse -Severity Error -EnableExit
      - name: Python scripts compile
        run: python3 -m compileall -q tools log/mock_upstream.py log/probe_free.py log/launch_detached.py deploy/geoip_update.py
      - name: Prometheus rules syntax
        run: python3 -c "import yaml,sys; d=yaml.safe_load(open('deploy/prometheus/rules.yml')); assert d['groups'], 'no rule groups'"
      - name: Alertmanager config syntax
        run: python3 -c "import yaml; yaml.safe_load(open('deploy/alertmanager.yml'))"
      - name: Dashboards + compose valid
        run: |
          python3 -c "import json,glob; [json.load(open(p)) for p in glob.glob('deploy/grafana/**/*.json', recursive=True)]"
          docker compose config --quiet
      - name: Gateway port consistency (8916, PORT-8916)
        # 正向断言（比全仓扫 8080 稳：18080/888x/历史注记天然豁免）。
        run: |
          grep -q "0.0.0.0:8916" gateway/src/main.rs
          grep -q "127.0.0.1:8916" tools/ipp.ps1
          grep -q "127.0.0.1:8916" tools/ipp_sdk.py
